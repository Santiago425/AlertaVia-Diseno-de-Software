services:
  - type: web
    name: alertavia-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        fromDatabase:
          name: alertavia-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: alertavia-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
      - key: PUBLIC_API_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: alertavia-db
    databaseName: alertavia_db
    user: alertavia
    plan: free
