services:
  - type: web
    name: alertavia-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: alertavia-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: alertavia-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: alertavia-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: alertavia-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: alertavia-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173

databases:
  - name: alertavia-db
    databaseName: alertavia_db
    user: alertavia_db_user
    plan: free
    region: ohio
    postgresMajorVersion: "16"
