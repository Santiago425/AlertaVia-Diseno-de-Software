spring.application.name=alertavia-backend
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/alertavia}
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET:alertavia-clave-de-desarrollo-para-firmar-tokens-jwt}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.admin.email=${ADMIN_EMAIL:admin@alertavia.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.demo.citizen-email=${DEMO_CITIZEN_EMAIL:ciudadano@alertavia.com}
app.demo.citizen-password=${DEMO_CITIZEN_PASSWORD:ciudadano123}

app.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.storage.local-dir=${LOCAL_UPLOAD_DIR:uploads}
app.storage.public-url=${PUBLIC_API_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
app.notifications.mail-from=${MAIL_FROM:notificaciones@alertavia.com}

springdoc.swagger-ui.path=/swagger-ui.html
