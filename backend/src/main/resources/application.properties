spring.application.name=alertavia-backend
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/alertavia_db}
spring.datasource.username=${DATABASE_USERNAME:alertavia}
spring.datasource.password=${DATABASE_PASSWORD:alertavia}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET:YWxlcnRhdmlhLWNsYXZlLWRlLWRlc2Fycm9sbG8tcGFyYS1maXJtYXItdG9rZW5zLWp3dA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.admin.email=${ADMIN_EMAIL:admin@alertavia.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

app.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.storage.local-dir=${LOCAL_UPLOAD_DIR:uploads}
app.storage.public-url=${PUBLIC_API_URL:http://localhost:8080}
app.notifications.mail-from=${MAIL_FROM:notificaciones@alertavia.com}

springdoc.swagger-ui.path=/swagger-ui.html
