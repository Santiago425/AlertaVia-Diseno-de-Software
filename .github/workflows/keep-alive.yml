name: Mantener backend activo

on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar el backend en Render
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://alertavia-backend.onrender.com/v3/api-docs || echo "000")
          echo "Respuesta del backend: $status"
