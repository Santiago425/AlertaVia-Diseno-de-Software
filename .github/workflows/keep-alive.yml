name: Mantener backend activo

on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BACKEND_URL: https://alertavia-backend.onrender.com
    steps:
      - name: Visitar el backend en Render
        run: |
          start=$(date +%s)
          status=000
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BACKEND_URL/api/auth/me" || true)
            echo "Intento $attempt: HTTP $status"
            if [ "$status" != "000" ] && [ "${status:0:1}" != "5" ]; then
              break
            fi
            sleep 10
          done
          elapsed=$(( $(date +%s) - start ))
          {
            echo "### Backend de AlertaVía"
            echo ""
            echo "| URL | Respuesta | Tiempo |"
            echo "|-----|-----------|--------|"
            echo "| $BACKEND_URL | HTTP $status | ${elapsed} s |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = "000" ] || [ "${status:0:1}" = "5" ]; then
            echo "::warning::El backend no respondió después de ${elapsed} segundos"
          else
            echo "Backend activo (HTTP $status) en ${elapsed} s"
          fi
