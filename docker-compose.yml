services:
  mongodb:
    image: mongo:7.0
    container_name: alertavia-mongo
    ports:
      - "27017:27017"
    volumes:
      - alertavia-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0
    container_name: alertavia-mongo-express
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"

  backend:
    build: ./backend
    container_name: alertavia-backend
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/alertavia
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - alertavia-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: alertavia-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  alertavia-data:
  alertavia-uploads:
