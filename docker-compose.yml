services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alertavia_db
      POSTGRES_USER: alertavia
      POSTGRES_PASSWORD: alertavia
    ports:
      - "5432:5432"
    volumes:
      - alertavia-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/alertavia_db
      DATABASE_USERNAME: alertavia
      DATABASE_PASSWORD: alertavia
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  alertavia-data:
